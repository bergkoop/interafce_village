<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern room prototype</title>
    <style>
        /* All sizes in the 3D scene use vmin, so the room scales with the screen */
        :root {
            --room-width: 170vmin;
            --room-height: 100vmin;
            --room-depth: 170vmin;
            --wood-dark: #2a1a10;
            --wood: #4a2f1c;
            --wood-line: #3a2415;
            --parchment: #e8d5a9;
            --fire: #ffb347;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background-color: #120b07;
            font-family: Georgia, serif;
            color: #f3e5c8;
        }

        /* ---------- The 3D scene ---------- */

        .viewport {
            position: fixed;
            inset: 0;
            perspective: 160vmin;
            overflow: hidden;
        }

        /* The camera holds the whole room. Moving around = moving the room. */
        .camera {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transition: transform 1.4s ease-in-out;
        }

        /* Every view uses the same list of transforms, so the browser can animate between them.
           scale() zooms in like a camera lens, rotateY() turns you, translate3d() moves the room.
           We zoom instead of walking all the way up to a wall, because walls that end up
           behind the viewer get drawn wrong in CSS 3D. */
        .camera[data-view="overview"]  { transform: scale(1)    rotateY(0deg)   translate3d(0, 0, 20vmin); }
        .camera[data-view="board"]     { transform: scale(1.75) rotateY(0deg)   translate3d(0, -2vmin, 40vmin); }
        .camera[data-view="fireplace"] { transform: scale(1.8)  rotateY(-90deg) translate3d(40vmin, -25vmin, 35vmin); }
        .camera[data-view="bard"]      { transform: scale(1.55) rotateY(90deg)  translate3d(-40vmin, -19vmin, 35vmin); }

        /* Phones held upright are narrow, so zoom in less */
        @media (orientation: portrait) {
            .camera[data-view="overview"]  { transform: scale(0.75) rotateY(0deg)   translate3d(0, 0, 20vmin); }
            .camera[data-view="board"]     { transform: scale(1.35) rotateY(0deg)   translate3d(0, -2vmin, 40vmin); }
            .camera[data-view="fireplace"] { transform: scale(1.4)  rotateY(-90deg) translate3d(40vmin, -25vmin, 35vmin); }
            .camera[data-view="bard"]      { transform: scale(1.4)  rotateY(90deg)  translate3d(-40vmin, -19vmin, 35vmin); }
        }

        .wall,
        .floor,
        .ceiling {
            position: absolute;
            transition: opacity 0.6s, visibility 0.6s;
        }

        /* The wall behind you fades away, otherwise it blocks your view */
        .camera[data-view="fireplace"] .wall.right,
        .camera[data-view="bard"] .wall.left {
            opacity: 0;
            visibility: hidden;
        }

        .wall {
            transform-style: preserve-3d; /* the spots on a wall get their own 3D layer */
            width: var(--room-depth);
            height: var(--room-height);
            left: calc(var(--room-depth) / -2);
            top: calc(var(--room-height) / -2);
            background:
                linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.1) 40%, rgba(0, 0, 0, 0.5)),
                repeating-linear-gradient(90deg, var(--wood) 0 7vmin, var(--wood-line) 7vmin 7.4vmin);
        }

        .wall.back {
            width: var(--room-width);
            left: calc(var(--room-width) / -2);
            transform: translateZ(calc(var(--room-depth) / -2));
        }

        .wall.left {
            transform: translateX(calc(var(--room-width) / -2)) rotateY(90deg);
        }

        .wall.right {
            transform: translateX(calc(var(--room-width) / 2)) rotateY(-90deg);
        }

        .floor,
        .ceiling {
            width: var(--room-width);
            height: var(--room-depth);
            left: calc(var(--room-width) / -2);
            top: calc(var(--room-depth) / -2);
        }

        .floor {
            transform: translateY(calc(var(--room-height) / 2)) rotateX(90deg);
            background:
                radial-gradient(circle at 50% 40%, rgba(255, 179, 71, 0.12), rgba(0, 0, 0, 0.6) 70%),
                repeating-linear-gradient(0deg, #3b2414 0 9vmin, #2a190d 9vmin 9.4vmin);
        }

        .ceiling {
            transform: translateY(calc(var(--room-height) / -2)) rotateX(-90deg);
            background:
                repeating-linear-gradient(90deg, #1d120a 0 20vmin, #140c06 20vmin 24vmin);
        }

        /* ---------- Clickable spots in the room ---------- */

        .spot {
            position: absolute;
            transform: translateZ(0.5vmin); /* just in front of the wall, so Chrome draws it correctly */
            cursor: pointer;
            transition: filter 0.3s;
        }

        .spot:hover {
            filter: drop-shadow(0 0 2vmin var(--fire));
        }

        .spot-label {
            position: absolute;
            left: 50%;
            bottom: -7vmin;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 4vmin;
            padding: 0.5vmin 2vmin;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 1vmin;
            transition: opacity 0.4s;
        }

        /* Labels are only visible in the overview */
        .camera:not([data-view="overview"]) .spot-label {
            opacity: 0;
        }

        /* Quest board on the back wall */
        .board {
            width: 80vmin;
            height: 50vmin;
            left: calc(50% - 40vmin);
            top: calc(50% - 27vmin);
            background-color: #6b4a2b;
            border: 2vmin solid var(--wood-dark);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .board .paper {
            width: 18vmin;
            height: 26vmin;
            background-color: var(--parchment);
            box-shadow: 0.5vmin 0.5vmin 1vmin rgba(0, 0, 0, 0.5);
        }

        .board .paper:nth-child(1) { transform: rotate(-4deg); }
        .board .paper:nth-child(2) { transform: rotate(2deg) translateY(-2vmin); }
        .board .paper:nth-child(3) { transform: rotate(-1deg); }

        /* Fireplace on the left wall */
        .fireplace {
            width: 60vmin;
            height: 50vmin;
            left: calc(50% + 5vmin); /* moved toward the back of the room */
            bottom: 0;
            background: repeating-linear-gradient(0deg, #5c5650 0 6vmin, #47423d 6vmin 6.5vmin);
            border-radius: 30vmin 30vmin 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .fireplace .fire {
            width: 34vmin;
            height: 28vmin;
            border-radius: 17vmin 17vmin 0 0;
            background: radial-gradient(ellipse at 50% 100%, #fff3b0, var(--fire) 30%, #c0390b 60%, #1a0d05 80%);
            animation: flicker 0.3s infinite alternate;
        }

        @keyframes flicker {
            from { opacity: 0.85; transform: scaleY(0.97); }
            to   { opacity: 1;    transform: scaleY(1.03); }
        }

        /* Bard's corner on the right wall */
        .stage {
            width: 60vmin;
            height: 62vmin;
            left: calc(50% - 65vmin); /* moved toward the back of the room */
            bottom: 0;
            background: repeating-linear-gradient(90deg, #7a1f1f 0 5vmin, #5e1515 5vmin 10vmin);
            border-top: 3vmin solid var(--wood-dark);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .stage .bard {
            width: 16vmin;
            height: 32vmin;
            margin-bottom: 8vmin;
            background-color: #1a110b;
            border-radius: 8vmin 8vmin 2vmin 2vmin;
            position: relative;
        }

        .stage .bard::before {
            content: '';
            position: absolute;
            width: 11vmin;
            height: 11vmin;
            left: 2.5vmin;
            top: -12vmin;
            border-radius: 50%;
            background-color: #1a110b;
        }

        .stage .floorboards {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 8vmin;
            background-color: var(--wood-dark);
        }

        /* ---------- Overlay UI (not in 3D) ---------- */

        .title {
            position: fixed;
            top: 2rem;
            left: 2rem;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #000;
        }

        .caption {
            position: fixed;
            left: 50%;
            top: 5rem;
            transform: translateX(-50%);
            max-width: 90vw;
            text-align: center;
            padding: 0.75rem 1.5rem;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 0.5rem;
        }

        .nav {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
        }

        .nav button {
            font: inherit;
            padding: 0.5rem 1rem;
            background-color: var(--wood-dark);
            color: inherit;
            border: 2px solid #6b4a2b;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .nav button.active {
            border-color: var(--fire);
            color: var(--fire);
        }

        /* People who turn off animations in their OS settings get instant jumps */
        @media (prefers-reduced-motion: reduce) {
            .camera { transition: none; }
            .fireplace .fire { animation: none; }
        }
    </style>
</head>
<body>
    <div class="viewport">
        <div class="camera" data-view="overview">
            <div class="ceiling"></div>
            <div class="floor"></div>

            <div class="wall back">
                <div class="spot board" data-go="board">
                    <div class="paper"></div>
                    <div class="paper"></div>
                    <div class="paper"></div>
                    <span class="spot-label">Quest Board</span>
                </div>
            </div>

            <div class="wall left">
                <div class="spot fireplace" data-go="fireplace">
                    <div class="fire"></div>
                    <span class="spot-label">Sit by the fire</span>
                </div>
            </div>

            <div class="wall right">
                <div class="spot stage" data-go="bard">
                    <div class="bard"></div>
                    <div class="floorboards"></div>
                    <span class="spot-label">The Bard</span>
                </div>
            </div>
        </div>
    </div>

    <h1 class="title">The Rusty Tankard</h1>

    <p class="caption">Click somewhere in the room to walk there.</p>

    <nav class="nav">
        <button data-go="overview" class="active">Room</button>
        <button data-go="fireplace">Fire</button>
        <button data-go="board">Quests</button>
        <button data-go="bard">Bard</button>
    </nav>

    <script>
        const camera = document.querySelector('.camera');
        const caption = document.querySelector('.caption');
        const navButtons = document.querySelectorAll('.nav button');

        const captions = {
            overview: 'Click somewhere in the room to walk there.',
            fireplace: 'You sit down by the fire. (The music starts here later.)',
            board: 'You walk up to the quest board. (The posters go here later.)',
            bard: 'You walk over to the bard. (His jokes go here later.)',
        };

        // JS only says WHERE you are, the CSS transition does the moving
        const goTo = (view) => {
            camera.dataset.view = view;
            caption.textContent = captions[view];
            navButtons.forEach((button) => {
                button.classList.toggle('active', button.dataset.go === view);
            });
        };

        // One listener for every element that has data-go (spots in the room and nav buttons)
        document.addEventListener('click', (event) => {
            const target = event.target.closest('[data-go]');
            if (target) {
                goTo(target.dataset.go);
            }
        });

        // Escape brings you back to the overview
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                goTo('overview');
            }
        });
    </script>
</body>
</html>
