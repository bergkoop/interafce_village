<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rusty Tankard | NeoCity Village</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>The Rusty Tankard</h1>
        <p>Gold: <span id="gold">0</span></p>
    </header>

    <main>
        <!-- Quest Board: the wanted posters get added here with JS -->
        <section id="quest-board">
            <h2>Quest Board</h2>
            <div id="quests"></div>
        </section>

        <!-- The Bard: his jokes get added here with JS -->
        <section id="bard">
            <h2>The Bard</h2>
            <p id="bard-text">The bard is tuning his lute...</p>
        </section>
    </main>

    <!-- type="module" is needed, otherwise import/export won't work -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
